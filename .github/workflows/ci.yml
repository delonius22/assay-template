name: ci
on: [push, pull_request]

jobs:
  scaffold:
    # Must always pass: structure, imports, shipped assets, and the plan chain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: python scripts/validate_chain.py .
      - run: pytest --collect-only -q
      - run: LANGGRAPH_STRICT_MSGPACK=true pytest tests/green -q
      - run: python -m assay check

  contract:
    # Red until the stubs are built; turns green ticket by ticket. Remove
    # continue-on-error once every ticket is done.
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: assay_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: LANGGRAPH_STRICT_MSGPACK=true pytest tests/contract -q
        env:
          ASSAY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/assay_test
