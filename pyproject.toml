[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assay"
version = "0.2.0"
description = "Grill an idea into a bank-grade PRD, a spec, and a CSV of stories, features, and tickets"
readme = "README.md"
requires-python = ">=3.14"
# Pinned exactly, not lower bounds (I14). Upgrade deliberately and rerun the
# acceptance suite, including LANGGRAPH_STRICT_MSGPACK=true and Postgres.
dependencies = [
    "langgraph==1.2.12",
    "langgraph-checkpoint-postgres==3.1.2",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain-core==1.6.6",
    "langchain-openai==1.6.7",
    "ag-ui-protocol==1.0.0",
    "pydantic==2.13.5",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "reportlab==4.4.10",
    "pyyaml==6.0.3",
]

[project.scripts]
assay = "assay.cli:main"

[dependency-groups]
dev = ["ruff", "mypy", "pytest==9.1.1", "httpx==0.28.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = [".plan-conductor", "web"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "D", "ANN", "RUF"]
ignore = ["D203", "D213", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# SKELETON: imports are pre-declared for bodies not yet written.
# Remove this entry once every NotImplementedError is gone.
"tests/**/*.py" = ["F401", "ANN", "D", "E501", "E731", "E741", "RUF005", "RUF012", "RUF059", "N818"]
"src/assay/vendor/**" = ["ALL"]
# Docstrings carry spec text, URLs, and patterns that cannot wrap.
"src/assay/**/*.py" = ["F401", "E501"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
exclude = ["src/assay/vendor/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
